# CI: runs on every push and pull request.
# It runs the same commands you run locally: install -> lint -> test -> docker build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  docker:
    # Only build the image if tests passed.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cicd-demo:ci .

      - name: Smoke test the container
        run: |
          docker run -d -p 3000:3000 --name app cicd-demo:ci
          sleep 3
          curl --fail http://localhost:3000/health
